<!DOCTYPE html>
<html lang="de">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Kinder Quiz</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);
            min-height: 100vh;
            user-select: none;
        }
        
        .font-bubble {
            font-family: 'Fredoka One', cursive;
        }

        .btn-bounce {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
        }
        
        .btn-bounce:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.02);
        }
        
        .btn-bounce:active:not(:disabled) {
            transform: translateY(2px) scale(0.98);
        }

        .card-shadow {
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.12), 0 10px 15px -5px rgba(0, 0, 0, 0.05);
        }

        .timer-bar {
            transition: width 1s linear, background-color 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes pulse-fast {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .pulse-warning {
            animation: pulse-fast 0.6s infinite;
        }

        @keyframes streak-pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-streak {
            animation: streak-pop 0.4s ease-out forwards;
        }
    </style>
</head>

    <script>
        // Web Audio API Synthesizer (Zero External Audio Dependencies)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'correct') {
                    // Cheerful Arpeggio Tone
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'wrong') {
                    // Friendly Low Bump
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.setValueAtTime(130, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'tick') {
                    // Soft Tick Tone
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.03, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'fanfare') {
                    // Celebration Fanfare
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.type = 'triangle';
                        o.frequency.setValueAtTime(freq, now + i * 0.12);
                        g.gain.setValueAtTime(0.25, now + i * 0.12);
                        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.3);
                        o.start(now + i * 0.12);
                        o.stop(now + i * 0.12 + 0.3);
                    });
                }
            } catch (e) {
                console.log("Audio playback not ready or blocked.");
            }
        }

        // Text To Speech (SpeechSynthesis API)
        let ttsEnabled = true;

        function toggleTTS() {
            ttsEnabled = !ttsEnabled;
            document.getElementById('tts-text').innerText = ttsEnabled ? "Vorlesen: AN" : "Vorlesen: AUS";
            if (!ttsEnabled) window.speechSynthesis.cancel();
        }

        function speakText(text) {
            if (!ttsEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';
            utterance.rate = 0.95; // Slightly slower pace for young children
            window.speechSynthesis.speak(utterance);
        }

        // Game State Variables
        let selectedCategory = null;
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let streak = 0;
        let timer = null;
        const TIME_LIMIT = 15;
        let timeLeft = TIME_LIMIT;
        let answered = false;

        // Local Storage High Scores
        let highScores = JSON.parse(localStorage.getItem('kinder_quiz_no_joker_hs')) || {
            tiere: 0, natur: 0, maerchen: 0, allgemein: 0, mix: 0, totalStars: 0
        };

        function updateHighscoreDisplay() {
            document.getElementById('hs-mix').innerText = `Highscore: ${highScores.mix || 0}`;
            document.getElementById('hs-tiere').innerText = `Highscore: ${highScores.tiere || 0}`;
            document.getElementById('hs-natur').innerText = `Highscore: ${highScores.natur || 0}`;
            document.getElementById('hs-maerchen').innerText = `Highscore: ${highScores.maerchen || 0}`;
            document.getElementById('hs-allgemein').innerText = `Highscore: ${highScores.allgemein || 0}`;
            document.getElementById('total-stars-count').innerText = highScores.totalStars || 0;
        }

        updateHighscoreDisplay();

        function selectCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('ring-4', 'ring-indigo-500', 'scale-105');
            });
            event.currentTarget.classList.add('ring-4', 'ring-indigo-500', 'scale-105');
            document.getElementById('start-btn').disabled = false;
        }

        function startQuiz() {
            if (!selectedCategory) return;

            let fullPool = [];
            if (selectedCategory === 'mix') {
                Object.values(questionsDB).forEach(catQuestions => {
                    fullPool = fullPool.concat(catQuestions);
                });
            } else {
                fullPool = [...questionsDB[selectedCategory]];
            }

            // Shuffle and select exactly 10 questions
            currentQuestions = fullPool.sort(() => 0.5 - Math.random()).slice(0, 10);
            currentQuestionIndex = 0;
            score = 0;
            streak = 0;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            showQuestion();
        }

        function showQuestion() {
            answered = false;
            clearInterval(timer);
            window.speechSynthesis.cancel();
            
            const qData = currentQuestions[currentQuestionIndex];
            
            // Update UI Counters
            document.getElementById('progress-text').innerText = `Frage ${currentQuestionIndex + 1} von 10`;
            document.getElementById('score-text').innerText = `Punkte: ${score}`;
            document.getElementById('question-text').innerText = qData.q;
            
            const feedback = document.getElementById('feedback');
            feedback.className = "hidden text-center py-3 px-4 rounded-xl font-bold text-base sm:text-lg";
            document.getElementById('next-btn').classList.add('hidden');

            // Streak Badge update
            const streakBadge = document.getElementById('streak-badge');
            if (streak > 1) {
                document.getElementById('streak-count').innerText = streak;
                streakBadge.classList.remove('hidden');
            } else {
                streakBadge.classList.add('hidden');
            }

            // Render Answer Option Buttons
            const answersGrid = document.getElementById('answers-grid');
            answersGrid.innerHTML = '';

            const colors = [
                'bg-blue-500 hover:bg-blue-600 border-blue-700',
                'bg-emerald-500 hover:bg-emerald-600 border-emerald-700',
                'bg-amber-500 hover:bg-amber-600 border-amber-700',
                'bg-purple-500 hover:bg-purple-600 border-purple-700'
            ];

            qData.a.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.id = `opt-btn-${idx}`;
                btn.className = `w-full py-3.5 px-4 text-white font-bold text-base sm:text-lg rounded-2xl border-b-4 shadow-md transition-all btn-bounce text-left flex items-center gap-3 ${colors[idx % colors.length]}`;
                btn.innerHTML = `<span class="bg-white/20 px-2.5 py-0.5 rounded-lg text-sm shrink-0">${String.fromCharCode(65 + idx)}</span> <span class="opt-text">${opt}</span>`;
                btn.onclick = () => checkAnswer(idx);
                answersGrid.appendChild(btn);
            });

            // Read Question Aloud
            readCurrentQuestion();

            // Start Timer
            startTimer();
        }

        function readCurrentQuestion() {
            const qData = currentQuestions[currentQuestionIndex];
            const textToRead = `${qData.q}. Option A: ${qData.a[0]}. Option B: ${qData.a[1]}. Option C: ${qData.a[2]}. Option D: ${qData.a[3]}`;
            speakText(textToRead);
        }

        function startTimer() {
            timeLeft = TIME_LIMIT;
            updateTimerUI();

            timer = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                playSound('tick');

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    timeOutHandler();
                }
            }, 1000);
        }

        function updateTimerUI() {
            const timerText = document.getElementById('timer-text');
            const timerBar = document.getElementById('timer-bar');

            timerText.innerText = `${timeLeft}s`;
            const percentage = (timeLeft / TIME_LIMIT) * 100;
            timerBar.style.width = `${percentage}%`;

            if (timeLeft <= 5) {
                timerBar.className = "timer-bar bg-red-500 h-full rounded-full w-full";
                timerText.classList.add('pulse-warning', 'text-red-600');
            } else {
                timerBar.className = "timer-bar bg-emerald-500 h-full rounded-full w-full";
                timerText.classList.remove('pulse-warning', 'text-red-600');
            }
        }

        function timeOutHandler() {
            if (answered) return;
            answered = true;
            streak = 0;
            playSound('wrong');

            const feedback = document.getElementById('feedback');
            feedback.innerText = "Zeit abgelaufen!";
            feedback.className = "text-center py-3 px-4 rounded-xl font-bold text-lg bg-orange-100 text-orange-800 block shake-animation";

            speakText("Die Zeit ist leider abgelaufen!");
            highlightCorrectAnswer();
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function checkAnswer(selectedIndex) {
            if (answered) return;
            answered = true;
            clearInterval(timer);

            const qData = currentQuestions[currentQuestionIndex];
            const feedback = document.getElementById('feedback');
            const qCard = document.getElementById('question-card');

            if (selectedIndex === qData.correct) {
                score++;
                streak++;
                playSound('correct');
                feedback.innerText = "Richtig! Gut gemacht!";
                feedback.className = "text-center py-3 px-4 rounded-xl font-bold text-lg bg-green-100 text-green-800 block border border-green-300";
                speakText("Richtig! Gut gemacht!");
            } else {
                streak = 0;
                playSound('wrong');
                feedback.innerText = "Leider falsch!";
                feedback.className = "text-center py-3 px-4 rounded-xl font-bold text-lg bg-red-100 text-red-800 block shake-animation border border-red-300";
                qCard.classList.add('shake-animation');
                setTimeout(() => qCard.classList.remove('shake-animation'), 500);
                speakText("Das war leider falsch!");
            }

            highlightCorrectAnswer(selectedIndex);
            document.getElementById('score-text').innerText = `Punkte: ${score}`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function highlightCorrectAnswer(selectedIndex = null) {
            const qData = currentQuestions[currentQuestionIndex];
            const buttons = document.getElementById('answers-grid').children;

            Array.from(buttons).forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.remove('btn-bounce', 'hover:bg-blue-600', 'hover:bg-emerald-600', 'hover:bg-amber-600', 'hover:bg-purple-600');
                
                if (idx === qData.correct) {
                    btn.className = "w-full py-3.5 px-4 text-white font-bold text-lg rounded-2xl border-b-4 shadow-md text-left flex items-center gap-3 bg-green-500 border-green-700 ring-4 ring-green-300";
                } else if (idx === selectedIndex) {
                    btn.className = "w-full py-3.5 px-4 text-white font-bold text-lg rounded-2xl border-b-4 shadow-md text-left flex items-center gap-3 bg-red-500 border-red-700 opacity-80";
                } else {
                    btn.className += " opacity-40";
                }
            });
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                showQuestion();
            } else {
                showEndScreen();
            }
        }

        function showEndScreen() {
            window.speechSynthesis.cancel();
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');

            document.getElementById('final-score').innerText = `${score} / 10`;

            // Update Highscores and Total Earned Stars in localStorage
            highScores.totalStars = (highScores.totalStars || 0) + score;
            if (selectedCategory && (!highScores[selectedCategory] || score > highScores[selectedCategory])) {
                highScores[selectedCategory] = score;
            }
            localStorage.setItem('kinder_quiz_no_joker_hs', JSON.stringify(highScores));
            updateHighscoreDisplay();

            const title = document.getElementById('result-title');
            const msg = document.getElementById('result-message');
            const stars = document.getElementById('star-rating');
            const badge = document.getElementById('badge-earned');

            // Render ratings (1 to 3 stars)
            if (score >= 9) {
                title.innerText = "Sensationell!";
                msg.innerText = "Du bist ein echtes Quiz-Genie!";
                stars.innerText = "⭐ ⭐ ⭐";
                badge.innerText = "Abzeichen: Quiz-Meister";
                playSound('fanfare');
                triggerConfetti();
                speakText("Sensationell! Du bist ein echtes Quiz-Genie!");
            } else if (score >= 7) {
                title.innerText = "Tolle Leistung!";
                msg.innerText = "Das hast du super gemacht!";
                stars.innerText = "⭐ ⭐ ⭐";
                badge.innerText = "Abzeichen: Schlaukopf";
                playSound('fanfare');
                triggerConfetti();
                speakText("Tolle Leistung! Das hast du super gemacht!");
            } else if (score >= 4) {
                title.innerText = "Gut gemacht!";
                msg.innerText = "Du weißt schon viele Dinge!";
                stars.innerText = "⭐ ⭐";
                badge.innerText = "Abzeichen: Entdecker";
                speakText("Gut gemacht! Du weißt schon viele Dinge!");
            } else {
                title.innerText = "Guter Versuch!";
                msg.innerText = "Übung macht den Meister!";
                stars.innerText = "⭐";
                badge.innerText = "Abzeichen: Anfänger";
                speakText("Guter Versuch! Übung macht den Meister!");
            }
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        function restartQuiz() {
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            selectedCategory = null;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('ring-4', 'ring-indigo-500', 'scale-105');
            });
            document.getElementById('start-btn').disabled = true;
        }
    </script>
</body>
</html>
